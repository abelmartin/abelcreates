<header class="site-header" id="site-header">
  <div class="header-container">
    <a class="site-brand" href="{{ '/' | relative_url }}">
      <span class="brand-avatar">@</span>
      <span class="brand-text">{{ site.title }}</span>
    </a>

    <nav class="site-nav" id="site-nav" aria-label="Main Navigation">
      <ul class="nav-list">
        <li><a href="{{ '/' | relative_url }}" class="nav-link {% if page.url == '/' %}active{% endif %}">Home</a></li>
        <li><a href="{{ '/about/' | relative_url }}"
            class="nav-link {% if page.url contains '/about' %}active{% endif %}">About</a></li>
        <li><a href="{{ '/#writing' | relative_url }}" class="nav-link">Writing</a></li>
        <li>
          <a href="https://github.com/abelmartin" target="_blank" rel="noopener noreferrer"
            class="nav-link nav-link-external" id="nav-github-link">
            <span>GitHub</span>
            <svg class="external-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
          </a>
        </li>
      </ul>
    </nav>
  </div>
</header>
